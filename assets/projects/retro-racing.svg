<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="aura-retro-racing" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#0e7490" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#aura-retro-racing)"/>
  <rect width="600" height="800" fill="url(#grid)"/>

  <!-- Top Category Bar -->
  <g transform="translate(48, 54)">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="700" fill="rgba(255,255,255,0.7)" letter-spacing="2.5" text-transform="uppercase">Canvas 2D Arcade</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(450, 42)">
    <rect width="102" height="30" rx="15" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <text x="51" y="20" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Multi-Track</text>
  </g>

  <!-- Central Graphic / Artwork -->
  <g filter="url(#shadow)">
    <path d="M220 540 L270 260 L330 260 L380 540" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="24 16"/>
           <line x1="300" y1="260" x2="300" y2="540" stroke="#facc15" stroke-width="6" stroke-dasharray="20 20"/>
           <rect x="275" y="420" width="50" height="75" rx="12" fill="#06b6d4" stroke="#ffffff" stroke-width="4"/>
           <rect x="285" y="435" width="30" height="25" rx="4" fill="#0f172a"/>
  </g>

  <!-- Bottom Brand Title & Info -->
  <g transform="translate(48, 620)">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-1">Retro Racing</text>
    <text y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.68)">Speed & Drift Arcade Racer</text>

    <!-- Tech Tags -->
    <g transform="translate(0, 56)">
      <g transform="translate(0, 0)">
          <rect width="105" height="28" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <text x="52.5" y="18" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.85)" text-anchor="middle">JavaScript</text>
        </g><g transform="translate(115, 0)">
          <rect width="105" height="28" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <text x="52.5" y="18" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.85)" text-anchor="middle">Canvas 2D</text>
        </g><g transform="translate(230, 0)">
          <rect width="105" height="28" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <text x="52.5" y="18" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.85)" text-anchor="middle">Arcade Physics</text>
        </g>
    </g>
  </g>
</svg>